<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Decentralized Voting System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

  <h1 class="login-main-title">Decentralized Voting Using Ethereum Blockchain</h1>

  <div class="login-card">
    <h2>Login</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="voterId">Voter ID</label>
        <input type="text" id="voterId" class="form-control" placeholder="Enter Voter ID (e.g. admin or voter1)" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Enter Password" required autocomplete="current-password">
      </div>

      <button type="submit" id="loginBtn" class="btn-primary">Login</button>
    </form>

    <div id="loginAlert" style="display: none; margin-top: 15px; font-size: 13px; color: #f87171;"></div>

    <div class="demo-credentials-box">
      <strong>Demo Test Credentials:</strong><br>
      • Administrator: <code>admin</code> / <code>password123</code><br>
      • Voter 1: <code>voter1</code> / <code>password123</code><br>
      • Voter 2: <code>voter2</code> / <code>password123</code>
    </div>
  </div>

  <script>
    // Redirect if already authenticated
    if (localStorage.getItem('user_role')) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const alertBox = document.getElementById('loginAlert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginBtn.innerText = 'Logging in...';
      loginBtn.disabled = true;
      alertBox.style.display = 'none';

      const voterId = document.getElementById('voterId').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ voterId, password })
        });
        const data = await response.json();

        if (data.success) {
          localStorage.setItem('user_id', data.user.voterId);
          localStorage.setItem('user_name', data.user.name);
          localStorage.setItem('user_role', data.user.role);
          window.location.href = 'dashboard.html';
        } else {
          alertBox.innerText = data.message || 'Login failed';
          alertBox.style.display = 'block';
          loginBtn.innerText = 'Login';
          loginBtn.disabled = false;
        }
      } catch (err) {
        alertBox.innerText = 'Server connection error. Please ensure backend is running.';
        alertBox.style.display = 'block';
        loginBtn.innerText = 'Login';
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
